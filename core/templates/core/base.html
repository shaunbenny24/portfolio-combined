<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    {% load static %}
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
     <style>
    /* ═══════════════════════════════════════════════════════════
       NAV COMPONENT — scoped overrides, safe against main.css
       All rules use #navbar / #sidebar prefix for specificity
    ═══════════════════════════════════════════════════════════ */
 
    /* ── CSS vars for the nav only (don't pollute :root) ── */
    #navbar,
    #sidebar,
    #sidebar-overlay {
      --nav-accent:        #4F46E5;
      --nav-accent-hover:  #4338CA;
      --nav-accent-light:  #EEF2FF;
      --nav-bg:            #ffffff;
      --nav-text:          #111827;
      --nav-text-mid:      #4B5563;
      --nav-text-light:    #9CA3AF;
      --nav-border:        #E5E7EB;
      --nav-border-light:  #F3F4F6;
      --nav-bg-off:        #F9FAFB;
      --nav-font-brand:    'Outfit', sans-serif;
      --nav-spring:        cubic-bezier(0.22, 1, 0.36, 1);
    }
 
    /* dark mode vars cascade into the scoped elements */
    body.dark-mode #navbar,
    body.dark-mode #sidebar,
    body.dark-mode #sidebar-overlay {
      --nav-bg:            #0F0F13;
      --nav-bg-off:        #18181F;
      --nav-text:          #F9FAFB;
      --nav-text-mid:      #9CA3AF;
      --nav-text-light:    #6B7280;
      --nav-border:        #27272A;
      --nav-border-light:  #1F1F27;
      --nav-accent-light:  #1E1B4B;
    }
 
    /* ─── THE NAV BAR ──────────────────────────────────────── */
    #navbar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 4.5rem !important;
      z-index: 1000 !important;
      /* reset main.css padding/flex that conflicts */
      padding: 0 !important;
      display: block !important;
      background: rgba(255,255,255,0.88) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border-bottom: 1px solid var(--nav-border-light) !important;
      transition: background 0.3s, box-shadow 0.3s !important;
    }
    body.dark-mode #navbar {
      background: rgba(15,15,19,0.92) !important;
    }
 
    /* ─── INNER CONTAINER ──────────────────────────────────── */
    #navbar .nav-inner {
      max-width: 80rem !important;
      margin: 0 auto !important;
      padding: 0 2.5rem !important;
      height: 4.5rem !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 1.5rem !important;
    }
 
    /* ─── LOGO ─────────────────────────────────────────────── */
    #navbar .nav-brand {
      display: flex !important;
      align-items: center !important;
      gap: 0.75rem !important;
      text-decoration: none !important;
      flex-shrink: 0 !important;
      font-family: var(--nav-font-brand) !important;
      font-weight: unset !important;
      font-size: unset !important;
      letter-spacing: unset !important;
      color: unset !important;
    }
 
    #navbar .brand-icon {
      width: 2.75rem !important;
      height: 2.75rem !important;
      background: var(--nav-accent-light) !important;
      border-radius: 0.625rem !important;
      display: grid !important;
      place-items: center !important;
      flex-shrink: 0 !important;
      transition: background 0.2s !important;
    }
    #navbar .nav-brand:hover .brand-icon {
      background: var(--nav-accent) !important;
    }
    #navbar .brand-icon svg {
      color: var(--nav-accent);
      transition: color 0.2s;
    }
    #navbar .nav-brand:hover .brand-icon svg {
      color: #fff !important;
    }
 
    #navbar .brand-text-block {
      display: flex !important;
      flex-direction: column !important;
      gap: 0.05rem !important;
    }
    #navbar .brand-name {
      font-family: var(--nav-font-brand) !important;
      font-weight: 800 !important;
      font-size: 1.2rem !important;
      color: var(--nav-text) !important;
      letter-spacing: -0.04em !important;
      line-height: 1.1 !important;
    }
    #navbar .brand-dot {
      color: var(--nav-accent) !important;
    }
    #navbar .brand-sub {
      font-size: 0.6rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.18em !important;
      text-transform: uppercase !important;
      color: var(--nav-text-light) !important;
      font-family: sans-serif !important;
    }
 
    /* ─── RIGHT GROUP (links + actions) ────────────────────── */
    #navbar .nav-right {
      display: flex !important;
      align-items: center !important;
      gap: 0.375rem !important;
      margin-left: auto !important;
    }
 
    /* ─── DESKTOP NAV LINKS ─────────────────────────────────── */
    #navbar .nav-links {
      display: flex !important;
      align-items: center !important;
      gap: 0.125rem !important;
      list-style: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #navbar .nav-links li {
      margin: 0 !important;
    }
    #navbar .nav-links li a {
      display: inline-block !important;
      padding: 0.4rem 0.75rem !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: var(--nav-text-mid) !important;
      text-decoration: none !important;
      border-radius: 0.5rem !important;
      transition: color 0.2s, background 0.2s !important;
      white-space: nowrap !important;
      background: transparent !important;
      font-family: sans-serif !important;
    }
    #navbar .nav-links li a:hover {
      color: var(--nav-accent) !important;
      background: var(--nav-accent-light) !important;
    }
    /* Admin pill */
    #navbar .nav-links li.nav-pill a {
      background: var(--nav-accent-light) !important;
      color: var(--nav-accent) !important;
      padding: 0.4rem 1.1rem !important;
      border-radius: 9999px !important;
      font-weight: 600 !important;
    }
    #navbar .nav-links li.nav-pill a:hover {
      background: var(--nav-accent) !important;
      color: #fff !important;
    }
 
    /* ─── ACTIONS CLUSTER ───────────────────────────────────── */
    #navbar .nav-actions {
      display: flex !important;
      align-items: center !important;
      gap: 0.5rem !important;
      flex-shrink: 0 !important;
    }
 
    /* Theme toggle */
    #navbar #theme-toggle {
      width: 2.25rem !important;
      height: 2.25rem !important;
      border-radius: 50% !important;
      border: 1.5px solid var(--nav-border) !important;
      background: transparent !important;
      cursor: pointer !important;
      font-size: 1rem !important;
      display: grid !important;
      place-items: center !important;
      transition: border-color 0.2s, background 0.2s, transform 0.25s !important;
      color: var(--nav-text-mid) !important;
      flex-shrink: 0 !important;
      padding: 0 !important;
    }
    #navbar #theme-toggle:hover {
      background: var(--nav-accent-light) !important;
      border-color: var(--nav-accent) !important;
      transform: rotate(22deg) !important;
      color: var(--nav-accent) !important;
    }
 
    /* Hamburger */
    #navbar #menu-toggle {
      display: none !important; /* overridden by responsive below */
      flex-direction: column !important;
      justify-content: center !important;
      align-items: flex-end !important;
      gap: 5px !important;
      width: 2.25rem !important;
      height: 2.25rem !important;
      background: none !important;
      border: none !important;
      cursor: pointer !important;
      padding: 0.3rem !important;
      flex-shrink: 0 !important;
    }
    #navbar #menu-toggle span {
      display: block !important;
      height: 2px !important;
      background: var(--nav-text) !important;
      border-radius: 9999px !important;
      transform-origin: center !important;
      transition: transform 0.35s var(--nav-spring), opacity 0.25s, width 0.3s !important;
    }
    #navbar #menu-toggle span:nth-child(1) { width: 22px !important; }
    #navbar #menu-toggle span:nth-child(2) { width: 15px !important; }
    #navbar #menu-toggle span:nth-child(3) { width: 22px !important; }
 
    #navbar #menu-toggle.open span:nth-child(1) {
      width: 22px !important;
      transform: translateY(7px) rotate(45deg) !important;
    }
    #navbar #menu-toggle.open span:nth-child(2) {
      opacity: 0 !important;
      transform: translateX(10px) !important;
    }
    #navbar #menu-toggle.open span:nth-child(3) {
      width: 22px !important;
      transform: translateY(-7px) rotate(-45deg) !important;
    }
 
    /* ─── SIDEBAR OVERLAY ───────────────────────────────────── */
    #sidebar-overlay {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,0.45) !important;
      backdrop-filter: blur(4px) !important;
      -webkit-backdrop-filter: blur(4px) !important;
      z-index: 1100 !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity 0.35s var(--nav-spring) !important;
    }
    #sidebar-overlay.visible {
      opacity: 1 !important;
      pointer-events: all !important;
    }
 
    /* ─── SIDEBAR DRAWER ────────────────────────────────────── */
    #sidebar {
      position: fixed !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: min(22rem, 100vw) !important;
      background: var(--nav-bg) !important;
      border-left: 1px solid var(--nav-border-light) !important;
      z-index: 1200 !important;
      display: flex !important;
      flex-direction: column !important;
      transform: translateX(100%) !important;
      transition: transform 0.4s var(--nav-spring) !important;
      overflow: hidden !important;
      /* reset any dashboard .sidebar styles from main.css */
      padding: 0 !important;
      height: auto !important;
      border-right: none !important;
      border-bottom: none !important;
    }
    #sidebar.open {
      transform: translateX(0) !important;
    }
 
    /* Sidebar header */
    #sidebar .sidebar-header {
      height: 4.5rem !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 0 1.5rem !important;
      border-bottom: 1px solid var(--nav-border-light) !important;
      flex-shrink: 0 !important;
      flex-direction: row !important; /* override main.css flex-wrap */
      flex-wrap: nowrap !important;
    }
 
    /* Sidebar logo (same as navbar) */
    #sidebar .nav-brand {
      display: flex !important;
      align-items: center !important;
      gap: 0.75rem !important;
      text-decoration: none !important;
      flex-shrink: 0 !important;
    }
    #sidebar .brand-icon {
      width: 2.5rem !important;
      height: 2.5rem !important;
      background: var(--nav-accent-light) !important;
      border-radius: 0.625rem !important;
      display: grid !important;
      place-items: center !important;
      flex-shrink: 0 !important;
    }
    #sidebar .brand-icon svg { color: var(--nav-accent); }
    #sidebar .brand-name {
      font-family: var(--nav-font-brand) !important;
      font-weight: 800 !important;
      font-size: 1.1rem !important;
      color: var(--nav-text) !important;
      letter-spacing: -0.04em !important;
      line-height: 1.1 !important;
    }
    #sidebar .brand-dot { color: var(--nav-accent) !important; }
    #sidebar .brand-sub {
      font-size: 0.58rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.18em !important;
      text-transform: uppercase !important;
      color: var(--nav-text-light) !important;
    }
 
    /* Close button */
    #sidebar .sidebar-close {
      width: 2rem !important;
      height: 2rem !important;
      border-radius: 50% !important;
      border: 1.5px solid var(--nav-border) !important;
      background: none !important;
      cursor: pointer !important;
      font-size: 0.85rem !important;
      display: grid !important;
      place-items: center !important;
      color: var(--nav-text-mid) !important;
      transition: background 0.2s, border-color 0.2s, color 0.2s !important;
      flex-shrink: 0 !important;
    }
    #sidebar .sidebar-close:hover {
      background: var(--nav-accent) !important;
      border-color: var(--nav-accent) !important;
      color: #fff !important;
    }
 
    /* Scrollable body */
    #sidebar .sidebar-body {
      padding: 1.5rem !important;
      flex: 1 !important;
      display: flex !important;
      flex-direction: column !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      min-height: 0 !important;
      /* reset main.css sticky positioning */
      position: static !important;
      height: auto !important;
    }
 
    /* Priority card */
    #sidebar .sidebar-card {
      background: var(--nav-bg-off) !important;
      border: 1px solid var(--nav-border-light) !important;
      border-radius: 1.25rem !important;
      padding: 1.5rem !important;
      margin-bottom: 1.75rem !important;
      flex-shrink: 0 !important;
    }
    #sidebar .sidebar-card-tag {
      display: inline-flex !important;
      align-items: center !important;
      gap: 0.4rem !important;
      font-size: 0.68rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.1em !important;
      text-transform: uppercase !important;
      color: var(--nav-accent) !important;
      background: var(--nav-accent-light) !important;
      padding: 0.3rem 0.7rem !important;
      border-radius: 9999px !important;
      margin-bottom: 0.875rem !important;
      font-family: sans-serif !important;
    }
    #sidebar .sidebar-card h3 {
      font-family: var(--nav-font-brand) !important;
      font-weight: 800 !important;
      font-size: 1.2rem !important;
      color: var(--nav-text) !important;
      line-height: 1.25 !important;
      margin-bottom: 0.5rem !important;
    }
    #sidebar .sidebar-card p {
      font-size: 0.8125rem !important;
      color: var(--nav-text-mid) !important;
      line-height: 1.55 !important;
      margin-bottom: 1.1rem !important;
    }
    #sidebar .sidebar-card-btn {
      display: inline-flex !important;
      align-items: center !important;
      gap: 0.4rem !important;
      font-size: 0.8125rem !important;
      font-weight: 600 !important;
      color: var(--nav-accent) !important;
      background: var(--nav-accent-light) !important;
      border: none !important;
      border-radius: 9999px !important;
      padding: 0.5rem 1.1rem !important;
      cursor: pointer !important;
      transition: background 0.2s, color 0.2s !important;
      text-decoration: none !important;
    }
    #sidebar .sidebar-card-btn:hover {
      background: var(--nav-accent) !important;
      color: #fff !important;
    }
 
    /* Sidebar nav list */
    #sidebar .sidebar-nav {
      list-style: none !important;
      flex: 1 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 0 !important;
    }
    #sidebar .sidebar-nav li {
      margin: 0 !important;
    }
    #sidebar .sidebar-nav li a {
      display: block !important;
      font-family: var(--nav-font-brand) !important;
      font-size: 1.25rem !important;
      font-weight: 700 !important;
      color: var(--nav-text) !important;
      text-decoration: none !important;
      padding: 0.9rem 0 !important;
      border-bottom: 1px solid var(--nav-border-light) !important;
      transition: color 0.2s, padding-left 0.25s var(--nav-spring) !important;
      letter-spacing: -0.025em !important;
      background: transparent !important;
      border-radius: 0 !important;
    }
    #sidebar .sidebar-nav li a:hover {
      color: var(--nav-accent) !important;
      padding-left: 0.6rem !important;
      background: transparent !important;
    }
    /* Admin pill in sidebar */
    #sidebar .sidebar-nav li.sidebar-pill {
      margin-top: 1rem !important;
    }
    #sidebar .sidebar-nav li.sidebar-pill a {
      display: inline-flex !important;
      font-family: sans-serif !important;
      font-size: 0.875rem !important;
      font-weight: 600 !important;
      letter-spacing: 0 !important;
      border-bottom: none !important;
      padding: 0.55rem 1.25rem !important;
      border-radius: 0.625rem !important;
      color: var(--nav-accent) !important;
      background: var(--nav-accent-light) !important;
    }
    #sidebar .sidebar-nav li.sidebar-pill a:hover {
      background: var(--nav-accent) !important;
      color: #fff !important;
      padding-left: 1.25rem !important;
    }
 
    /* Sidebar footer */
    #sidebar .sidebar-footer {
      padding-top: 1.25rem !important;
      padding-bottom: 0.5rem !important;
      margin-top: auto !important;
      flex-shrink: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      border-top: 1px solid var(--nav-border-light) !important;
      flex-direction: row !important;
    }
    #sidebar .sidebar-copyright {
      font-size: 0.65rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.15em !important;
      text-transform: uppercase !important;
      color: var(--nav-text-light) !important;
    }
    #sidebar #theme-toggle-sidebar {
      background: none !important;
      border: 1.5px solid var(--nav-border) !important;
      border-radius: 50% !important;
      width: 2rem !important;
      height: 2rem !important;
      cursor: pointer !important;
      font-size: 0.9rem !important;
      display: grid !important;
      place-items: center !important;
      transition: border-color 0.2s, background 0.2s !important;
      color: var(--nav-text-mid) !important;
      padding: 0 !important;
    }
    #sidebar #theme-toggle-sidebar:hover {
      background: var(--nav-accent-light) !important;
      border-color: var(--nav-accent) !important;
    }
 
    /* ─── RESPONSIVE ────────────────────────────────────────── */
    @media (max-width: 1023px) {
      #navbar .nav-links {
        display: none !important;
      }
      #navbar #menu-toggle {
        display: flex !important;
      }
      #navbar .nav-right {
        gap: 0.375rem !important;
      }
    }
    @media (min-width: 1024px) {
      #sidebar        { display: none !important; }
      #sidebar-overlay{ display: none !important; }
      #navbar #menu-toggle { display: none !important; }
    }
  </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    
    {% block content %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script>
  const menuToggle    = document.getElementById('menu-toggle');
  const sidebar       = document.getElementById('sidebar');
  const overlay       = document.getElementById('sidebar-overlay');
  const closeBtn      = document.getElementById('sidebar-close');
  const themeToggle   = document.getElementById('theme-toggle');
  const themeToggleSb = document.getElementById('theme-toggle-sidebar');
  const themeIcon     = document.getElementById('theme-icon');
  const themeIconSb   = document.getElementById('theme-icon-sidebar');
  const sidebarLinks  = document.querySelectorAll('.sidebar-link, #sidebar-cta');
 
  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
    menuToggle.classList.add('open');
    menuToggle.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
    menuToggle.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }
 
  menuToggle.addEventListener('click', () =>
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  closeBtn.addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);
  sidebarLinks.forEach(l => l.addEventListener('click', closeSidebar));
  document.addEventListener('keydown', e => e.key === 'Escape' && closeSidebar());
 
  function setTheme(dark) {
    document.body.classList.toggle('dark-mode', dark);
    const icon = dark ? '🌙' : '☀️';
    themeIcon.textContent   = icon;
    themeIconSb.textContent = icon;
    localStorage.setItem('sb-theme', dark ? 'dark' : 'light');
  }
  const saved = localStorage.getItem('sb-theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) setTheme(true);
 
  themeToggle.addEventListener('click',   () => setTheme(!document.body.classList.contains('dark-mode')));
  themeToggleSb.addEventListener('click', () => setTheme(!document.body.classList.contains('dark-mode')));
 
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').style.boxShadow =
      window.scrollY > 8 ? '0 2px 24px rgba(0,0,0,0.08)' : 'none';
  }, { passive: true });
</script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
    
</body>

</html>
